name: Newsletter stages Maroc

# Declenchement hebdomadaire gere par VERCEL CRON (site/vercel.json ->
# /api/cron/newsletter), pas par le "schedule" natif de GitHub Actions --
# voir le commentaire equivalent dans scrape.yml (schedule GitHub best-effort,
# retards/oublis constates fin aout 2026). Secrets deja configures sur ce
# depot (DATABASE_URL, SMTP_SERVER, SMTP_PORT, SMTP_USER, SMTP_PASS,
# FROM_EMAIL, SITE_URL). newsletter.py n'envoie de toute facon rien si
# aucune offre n'a ete detectee depuis le dernier passage (pas de mail vide).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (n'envoie aucun email, affiche juste ce qui serait envoye)"
        type: boolean
        default: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dependances Python
        run: pip install -r requirements.txt

      - name: Envoyer le digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python newsletter.py --dry-run
          else
            python newsletter.py
          fi

      - name: Alerte par email en cas d'échec
        if: failure()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: >
          python notifier.py
          "Echec de la newsletter - Stages au Maroc"
          "Le run programme le $(date -u +'%Y-%m-%d %H:%M UTC') a echoue. Voir : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
