name: Scraping stages Maroc

# Déclenchement quotidien géré par VERCEL CRON (site/vercel.json ->
# /api/cron/scrape), pas par le "schedule" natif de GitHub Actions : ce
# dernier s'est révélé peu fiable en pratique (retards de plusieurs heures,
# runs sautés lors d'incidents sur la plateforme GitHub, cf. 26-28/08/2026)
# -- doc GitHub elle-même : "schedule" est best-effort, pas garanti.
# Vercel Cron appelle l'API GitHub (workflow_dispatch) à l'heure prévue ;
# le travail long (jusqu'à ~2h) continue de tourner ici, hors des limites
# de durée des fonctions serverless Vercel. DATABASE_URL est configuré
# (secret GitHub Actions, connexion directe Supabase port 5432).
on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # QUERIES est passee a ~63 requetes (couverture "tous domaines/tous
    # postes") x 9 localisations x 2 pages (+ passe fraicheur) : estimation
    # ~100-125 min pour le balayage LinkedIn seul. Marge large (dépôt public
    # = minutes Actions illimitées) plutôt que de reproduire l'incident de
    # timeout déjà rencontré sur sourcing-regie-banque.
    timeout-minutes: 180

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      # Sans ce cache, CHAQUE run cloud repartirait de zéro et
      # re-téléchargerait toutes les fiches LinkedIn déjà vues — c'est
      # exactement ce qui a fait dépasser un timeout de 90 min sur
      # sourcing-regie-banque. Pattern "restore + save toujours" : la clé de
      # sauvegarde varie à chaque run (run_id), la restauration prend la
      # plus récente correspondant au préfixe.
      - name: Restaurer le cache de scraping (annonces déjà vues)
        uses: actions/cache/restore@v4
        with:
          path: cache_stages_maroc.json
          key: stages-maroc-scrape-cache-${{ github.run_id }}
          restore-keys: |
            stages-maroc-scrape-cache-

      - name: "Run complet (scrape + classification + Excel + base de données)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python stages_maroc.py

      - name: Sauvegarder le cache de scraping (même si le run a échoué)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_stages_maroc.json
          key: stages-maroc-scrape-cache-${{ github.run_id }}

      - name: Alerte par email en cas d'échec
        if: failure()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: >
          python notifier.py
          "Echec du scraping - Stages au Maroc"
          "Le run programme le $(date -u +'%Y-%m-%d %H:%M UTC') a echoue. Voir : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
